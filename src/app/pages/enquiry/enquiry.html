                <app-custom-table [columnArray]="columList" [tableData]="enquiryList()" [showLoader]="loader()"

    <div class="col-5">
        <div class="card">
            <div class="card-header bg-warning">
                Form
            </div>
            <div class="card-body">

                <div class="row g-3">

                    <!-- Customer Name -->
                    <div class="col-md-6">
                        <label for="customerName" class="form-label">
                            Customer Name <span class="text-danger">*</span>
                        </label>
                        <input type="text" [(ngModel)]="enquiryObj.customerName" class="form-control" id="customerName"
                            placeholder="Enter customer name">
                    </div>

                    <!-- Customer Email -->
                    <div class="col-md-6">
                        <label for="customerEmail" class="form-label">
                            Customer Email <span class="text-danger">*</span>
                        </label>
                        <input type="email" [(ngModel)]="enquiryObj.customerEmail" class="form-control"
                            id="customerEmail" placeholder="Enter email address">
                    </div>

                    <!-- Customer Phone -->
                    <div class="col-md-6">
                        <label for="customerPhone" class="form-label">
                            Customer Phone
                        </label>
                        <input type="tel" [(ngModel)]="enquiryObj.customerPhone" class="form-control" id="customerPhone"
                            placeholder="Enter phone number">
                    </div>

                    <!-- Enquiry Type -->
                    <div class="col-md-6">
                        <label for="enquiryType" class="form-label">
                            Enquiry Type
                        </label>
                        <select [(ngModel)]="enquiryObj.enquiryType" class="form-select" id="enquiryType">
                            <option selected disabled>Select enquiry type</option>
                            <option>Sales</option>
                            <option>Support</option>
                            <option>General</option>
                        </select>
                    </div>

                    <!-- Category -->
                    <div class="col-md-6">
                        <label for="categoryId" class="form-label">
                            Category <span class="text-danger">*</span>
                        </label>
                        <select [(ngModel)]="enquiryObj.categoryId" class="form-select" id="categoryId">
                            <option selected disabled>Select category</option>
                            @for (item of categoryList(); track $index) {
                            <option [value]="item.categoryId">{{item.categoryName}}</option>
                            }
                        </select>
                    </div>

                    <!-- Status -->
                    <div class="col-md-6">
                        <label for="statusId" class="form-label">
                            Status <span class="text-danger">*</span>
                        </label>
                        <select class="form-select" [(ngModel)]="enquiryObj.statusId" id="statusId">
                            <option selected disabled>Select status</option>
                            @for (item of statusList(); track $index) {
                            <option [value]="item.statusId">{{item.statusName}}</option>
                            }
                        </select>
                    </div>

                    <!-- Enquiry Date -->
                    <div class="col-md-6">
                        <label for="enquiryDate" class="form-label">
                            Enquiry Date
                        </label>
                        <input [(ngModel)]="enquiryObj.enquiryDate" type="datetime-local" class="form-control"
                            id="enquiryDate">
                    </div>

                    <!-- Follow Up Date -->
                    <div class="col-md-6">
                        <label for="followUpDate" class="form-label">
                            Follow Up Date
                        </label>
                        <input [(ngModel)]="enquiryObj.followUpDate" type="datetime-local" class="form-control"
                            id="followUpDate">
                    </div>

                    <!-- Converted -->
                    <div class="col-md-6">
                        <div class="form-check form-switch mt-4 pt-2">
                            <input [(ngModel)]="enquiryObj.isConverted" class="form-check-input" type="checkbox"
                                role="switch" id="isConverted">
                            <label class="form-check-label" for="isConverted">
                                Enquiry Converted
                            </label>
                        </div>
                    </div>

                    <!-- Message -->
                    <div class="col-12">
                        <label for="message" class="form-label">
                            Message
                        </label>
                        <textarea [(ngModel)]="enquiryObj.message" class="form-control" id="message" rows="4"
                            placeholder="Enter enquiry message"></textarea>
                    </div>

                    <!-- Feedback -->
                    <div class="col-12">
                        <label for="feedback" class="form-label">
                            Feedback
                        </label>
                        <textarea [(ngModel)]="enquiryObj.feedback" class="form-control" id="feedback" rows="3"
                            placeholder="Enter feedback"></textarea>
                    </div>

                </div>

                <div class="row">
                    <div class="col-6">
                        <button type="button" class="btn btn-secondary" (click)="onResetEnquiry()">
                            Reset
                        </button>
                    </div>
                    <div class="col-6">
                        @if(enquiryObj.enquiryId===0){
                        <button type="button" class="btn btn-primary" (click)="onSaveEnquiry()">
                            Save Enquiry
                        </button>}
                        @else{
                        <button type="button" class="btn btn-success" (click)="onUpdateEnquiry()">
                            Update Enquiry
                        </button>}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
