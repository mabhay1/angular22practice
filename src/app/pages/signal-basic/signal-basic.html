<div class="row">
    <div appHighlight [colorName]="'blue'" class="col-3">
        {{productName}}
    </div>
    <div class="col-2">
        <button class="btn btn-success" (click)="onChange()">Change</button>
    </div>
    <div appHighlight [colorName]="'green'" class="col-3">
        {{productPrice()}}
    </div>
    <div class="col-2">
        {{isProductActive()}}
    </div>
</div>
<div class="row">
    <div class="col-3">
        <button (click)="setTechName('Java')" class="btn btn-sm btn-primary">Java</button>
    </div>
    <div class="col-3">
        <button (click)="setTechName('Angular')" class="btn btn-sm btn-primary">Angular</button>
    </div>
    <div class="col-3">
        <button (click)="setTechName('React')" class="btn btn-sm btn-primary">React</button>
    </div>
    <div class="col-3">
        techName -- {{techName()}}
    </div>
</div>
<div class="row">
    <div class="col-3">
        <input [(ngModel)]="cityName" type="text" placeholder="Enter City">
    </div>
    <div class="col-2">
        <button (click)="addCity()">Add City</button>
    </div>
    <div class="col-3">
        <ul>
            @for (item of cityList(); track $index) {
                <li>{{item}}</li>
            }
        </ul>
    </div>
</div>
<div class="row">
    <div class="col-3">
        <button (click)="onDecrement()">--</button>
    </div>
    <div class="col-3">{{counter()}}</div>
    <div class="col-3">
        <button (click)="onIncrement()">++</button>
    </div>
</div>

<div class="row">
    <div class="col-3">
        <button (click)="changeName()">Name</button>
    </div>
    <div class="col-3">
        <p>{{student().studentName}}</p>
        <p>{{student().studentCity}}</p>
    </div>
</div>
