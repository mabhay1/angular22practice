        <!-- Employee Form -->
        <div class="col-lg-4">

            <div class="card border-0 shadow-sm">

                <div class="card-header bg-white border-bottom py-3">

                    <h5 class="mb-1 fw-semibold">
                        <i class="fa-solid fa-user-plus me-2 text-primary"></i>
                        Employee Details
                    </h5>

                    <small class="text-muted">
                        Add or update employee information
                    </small>

                </div>

                <div class="card-body">

                    <form>

                        <!-- Employee Name -->
                        <div class="mb-3">
                            <label class="form-label fw-medium">
                                Employee Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   [formField]="employeeForm.employeeName"
                                   placeholder="Enter employee name">
                            @if (employeeForm.employeeName().touched()||employeeForm.employeeName().dirty()) {       
                            <div>
                                @for (item of employeeForm.employeeName().errors(); track $index) {
                                <div class="text-danger">{{item.message}}</div>
                                }
                            </div> }      
                        </div>


                        <!-- Contact + Email -->
                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-medium">
                                    Contact No
                                </label>

                                <input type="text"
                                       class="form-control"
                                       [formField]="employeeForm.contactNo"
                                       placeholder="Contact number">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-medium">
                                    Email
                                </label>

                                <input type="email"
                                       class="form-control"
                                       [formField]="employeeForm.emailId"
                                       placeholder="Email address">
                            </div>

                        </div>


                        <!-- Department -->
                        <div class="mb-3">
                            <label class="form-label fw-medium">
                                Department
                            </label>

                            <select class="form-select" [formField]="employeeForm.deptId">
                                <option value="0">Select Department</option>
                                @for (item of childDept$|async; track $index) {
                                <option [value]="item.childDeptId">{{item.departmentName}}</option>
                                }
                            </select>
                        </div>


                        <!-- Gender -->
                        <div class="mb-3">

                            <label class="form-label fw-medium">
                                Gender
                            </label>

                            <div class="d-flex gap-4">

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="radio"
                                           [formField]="employeeForm.gender"
                                           id="male"
                                           value="Male">

                                    <label class="form-check-label" for="male">
                                        Male
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="radio"
                                           [formField]="employeeForm.gender"
                                           id="female"
                                           value="Female">

                                    <label class="form-check-label" for="female">
                                        Female
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="radio"
                                           [formField]="employeeForm.gender"
                                           id="other"
                                           value="Other">

                                    <label class="form-check-label" for="other">
                                        Other
                                    </label>
                                </div>

                            </div>

                        </div>


                        <!-- Role -->
                        <div class="mb-3">
                            <label class="form-label fw-medium">
                                Role
                            </label>

                            <select class="form-select" [formField]="employeeForm.role">
                                <option value="">Select Role</option>
                                <option value="Admin">Admin</option>
                                <option value="Manager">Manager</option>
                                <option value="Employee">Employee</option>
                            </select>
                        </div>


                        <!-- Password -->
                        <div class="mb-3">

                            <label class="form-label fw-medium">
                                Password
                            </label>

                            <div class="input-group">

                                <input type="password"
                                       class="form-control"
                                       [formField]="employeeForm.password"
                                       placeholder="Enter password">

                                <button type="button"
                                        class="btn btn-outline-secondary">
                                    <i class="fa-solid fa-eye"></i>
                                </button>

                            </div>

                        </div>


                        <!-- Buttons -->
                        <div class="d-flex gap-2 pt-2">

                            <button type="button"
                            (click)="onSubmit()"
                                    class="btn btn-primary flex-grow-1">
                                <i class="fa-solid fa-floppy-disk me-1"></i>
                                Save Employee
                            </button>

                            <button type="button"
                                    class="btn btn-outline-secondary">
                                <i class="fa-solid fa-rotate-left me-1"></i>
                                Reset
                            </button>

                        </div>

                    </form>

                </div>
            </div>

        </div>

    </div>

</div>
