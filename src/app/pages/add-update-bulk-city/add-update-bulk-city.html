<div class="container">
    <div class="row">
        <div class="col-3">
            <div class="row">
                <div class="col-6">
                    <button class="btn btn-sm btn-success" (click)="addRow()">Add Row</button>
                </div>
                <div class="col-6">
                    <button class="btn btn-sm btn-warning" (click)="addUpdateBulkCity()">Upload Bulk City</button>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-3">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>SNo</th>
                        <th>CityName</th>
                    </tr>
                </thead>
                <tbody>
                    @for(item of cityList(); track $index){
                    <tr>
                        <td>{{$index+1}}</td>
                        <td><input type="text" class="form-control" [(ngModel)]="item.cityName"></td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
